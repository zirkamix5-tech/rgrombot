services:
  - type: web
    name: twitch-unified-bot
    env: node
    buildCommand: npm install
    startCommand: npm start
    plan: starter
    region: ohio
    envVars:
      - key: PORT
        value: "3000"
      - key: BOT_NAME
        value: "RGROMBOT"
      - key: TWITCH_OAUTH
        value: "oauth:YOUR_OAUTH_TOKEN_HERE"
      - key: MAIN_CHANNEL
        value: "QumosX"
      - key: CHANNELS
        value: "Blind_Mdfk,vctivanova,QumosX,r0magr0m"
    healthCheckPath: /health
    healthCheckInterval: 30
    healthCheckTimeout: 10
    healthCheckStartupDelay: 15
